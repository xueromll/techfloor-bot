name = "techfloor-test"
main = "../src/worker.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["* * * * *"]

[assets]
directory = "../webapp"

[vars]
APP_SHORT_NAME = "techfloor"
TZ_NAME = "Europe/Moscow"
ROOM_REMIND_HOUR = "0"
PLAYROOM = "on"
ALLOWED_CHATS = "-1001234, -1009999"
RATE_LIMIT_SCALE = "10"
OWNER_ID = "1"
TELEGRAM_API = "http://127.0.0.1:8799"

[[d1_databases]]
binding = "DB"
database_name = "laundry"
database_id = "00000000-0000-0000-0000-000000000000"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Техэтаж</title>
<script src="/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #d64545);
    --free: #2e9e5b;
    --run: #2f7ed8;
    --parked: #d94a8c;
    --busy: #d64545;
    --hold: #c9900f;
    --done: #8e5bd6;
    --loaded: #d6762e;
    --line: rgba(128, 128, 128, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #app { padding: 12px 12px 32px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 4px 2px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 17px; margin: 0; }
  p { margin: 0 0 10px; }
  .hint { color: var(--hint); font-size: 13px; }
  .head { margin-bottom: 12px; }
  .head .hint { margin: 0 4px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
  .tab { flex: 1; border: 0; background: transparent; color: var(--text); padding: 9px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--accent-text); }
  .wall { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 6px; }
  .wall + .wall { margin-top: 10px; }
  .tile { border: 0; border-radius: 10px; padding: 8px 2px; font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; justify-content: center; border-bottom: 3px solid transparent; }
  .tile b { font-size: 18px; }
  .tile small { font-size: 11px; color: var(--hint); white-space: nowrap; }
  .tile.free { background: rgba(46, 158, 91, 0.14); border-bottom-color: var(--free); }
  .tile.run { background: rgba(47, 126, 216, 0.14); border-bottom-color: var(--run); }
  .tile.parked { background: rgba(217, 74, 140, 0.14); border-bottom-color: var(--parked); }
  .tile.hold { background: rgba(201, 144, 15, 0.16); border-bottom-color: var(--hold); }
  .tile.done { background: rgba(142, 91, 214, 0.15); border-bottom-color: var(--done); }
  .tile.loaded { background: rgba(214, 118, 46, 0.16); border-bottom-color: var(--loaded); }
  .tile.broken { background: rgba(128, 128, 128, 0.16); border-bottom-color: var(--hint); }
  .tile.broken b { text-decoration: line-through; color: var(--hint); }
  .tile.booked { outline: 2px dashed var(--busy); outline-offset: -2px; }
  .tile.mine { outline: 2px solid var(--accent); outline-offset: -2px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 2px; }
  .legend span, .line { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.free { background: var(--free); }
  .dot.run { background: var(--run); }
  .dot.parked { background: var(--parked); }
  .dot.busy { background: var(--busy); }
  .dot.booked { background: transparent; border: 2px dashed var(--busy); border-radius: 3px; width: 11px; height: 11px; }
  .dot.hold { background: var(--hold); }
  .dot.done { background: var(--done); }
  .dot.loaded { background: var(--loaded); }
  .dot.broken { background: var(--hint); }
  .lines { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
  .line { padding: 6px 0; cursor: pointer; }
  .item { border-top: 1px solid var(--line); padding: 10px 0; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 8px; background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: rgba(128, 128, 128, 0.14); color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn.small { width: auto; padding: 7px 12px; margin: 0; font-size: 14px; }
  .btn:disabled { opacity: 0.5; }
  input { width: 100%; font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center; }
  select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  textarea { display: block; width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
  .kinds { display: flex; flex-direction: column; gap: 6px; }
  .kinds .chip { text-align: left; padding: 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal .wd { font-size: 12px; color: var(--hint); padding: 4px 0; }
  .day { position: relative; border: 0; border-radius: 9px; padding: 9px 0; font: inherit; background: rgba(128, 128, 128, 0.1); color: var(--text); cursor: pointer; }
  .day.out { background: transparent; color: var(--hint); opacity: 0.45; cursor: default; }
  .day.today { font-weight: 700; }
  .day.sel { background: var(--accent); color: var(--accent-text); }
  .day.has::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--hold); }
  .day.open::after { background: var(--free); }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .badge.open { background: rgba(46, 158, 91, 0.16); color: var(--free); }
  .badge.closed { background: rgba(128, 128, 128, 0.14); color: var(--hint); }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex: none; }
  .x:disabled { opacity: 0.3; }
  .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); }
  label { display: block; margin-bottom: 6px; color: var(--hint); font-size: 13px; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 10px; }
  .chips.six { grid-template-columns: repeat(6, 1fr); }
  .chips.three { grid-template-columns: repeat(3, 1fr); }
  .chips.two { grid-template-columns: 1fr 1fr; }
  .chips.two .chip { padding: 12px 8px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .card.guide { border: 2px solid var(--accent); }
  .step { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; }
  .step > i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-style: normal; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .step > div { flex: 1; min-width: 0; }
  .step p { margin: 2px 0 0; }
  .demo { background: var(--bg); border-radius: 12px; padding: 10px; margin-top: 8px; pointer-events: none; }
  .demo .wall { grid-template-columns: repeat(4, 1fr); margin: 0; }
  .demo .chips { margin: 0 0 6px; }
  .demo .chips:last-child, .demo .btn:last-child { margin-bottom: 0; }
  .demo .btn { margin-top: 6px; }
  .demo .chip, .demo .btn { text-align: center; }
  .demo .tap { box-shadow: 0 0 0 3px var(--accent); }
  .legend-rows { display: grid; gap: 8px; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .legend-row .tile { width: 76px; min-height: 46px; flex: none; padding: 4px 2px; }
  .legend-row .tile b { font-size: 15px; }
  .legend-row .mark { width: 76px; flex: none; display: flex; justify-content: center; }
  .legend-row .mark .day { width: 40px; text-align: center; }
  .legend-row .mark .badge { margin: 0; }
  .legend-row .mark .btn { white-space: nowrap; font-size: 12px; padding: 6px 8px; }
  .demo .fake { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .demo .day { text-align: center; }
  .demo .toggle span { color: var(--text); }
  .demo .line { cursor: default; padding: 0; }
  .name-toggle { margin: 0 0 12px; }
  .name-toggle span { color: var(--text); }
  .bubble { background: var(--card); border-radius: 12px 12px 12px 4px; padding: 8px 10px; font-size: 14px; }
  .bubble b { display: block; color: var(--accent); font-size: 13px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .total { text-align: center; color: var(--hint); font-size: 13px; margin: 10px 0 0; min-height: 18px; }
  .chip { border: 0; border-radius: 9px; padding: 10px 0; font: inherit; font-weight: 600; background: rgba(128, 128, 128, 0.14); color: var(--text); cursor: pointer; }
  .label { font-size: 13px; color: var(--hint); margin-top: 8px; }
  #sheet[hidden] { display: none; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85vh; overflow: auto; background: var(--card); border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .x { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 4px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--hint); }
</style>
</head>
<body>
<div id="app"><div class="empty" id="boot">Загрузка…</div></div>
<div id="sheet" hidden></div>
<script>
(function () {
  var started = Date.now();
  function stuck(reason) {
    var boot = document.getElementById("boot");
    if (!boot) return;
    var w = window.Telegram && window.Telegram.WebApp;
    var device = (w ? "Telegram " + w.platform + " " + w.version + "; " : "") + navigator.userAgent;
    boot.removeAttribute("id");
    boot.innerHTML = "";
    var lines = [
      "Приложение не запустилось на этом устройстве.",
      "Сделай скриншот этого экрана и отправь его боту через /problem — так получится найти причину.",
      reason,
      device,
    ];
    for (var i = 0; i < lines.length; i++) {
      var p = document.createElement("p");
      p.textContent = lines[i];
      if (i > 1) p.style.cssText = "font-size:12px;word-break:break-word;text-align:left";
      boot.appendChild(p);
    }
  }
  window.addEventListener("error", function (e) {
    stuck("Ошибка: " + (e.message || e.error || "неизвестно") + (e.lineno ? " (строка " + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    stuck("Ошибка: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () {
    stuck("Не загрузилось за " + Math.round((Date.now() - started) / 1000) + " сек.");
  }, 30000);
})();
</script>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const initData = (tg && tg.initData) || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
const app = document.getElementById("app");
const sheet = document.getElementById("sheet");
let S = null;
let tab = "w";
let section = null;
let roomDay = null;
let roomMonth = null;
let skew = 0;
let busy = false;
let loading = false;
let poll = null;

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : String(c));
  }
  return node;
}

const now = () => Date.now() / 1000 + skew;
const who = (p) => (p.username ? "@" + p.username : p.name);
const isMe = (p) => !!p && p.id === S.me.id;
const mname = (m) => `${S.types[m.t].name} ${m.n}`;
const clock = (ts) => new Intl.DateTimeFormat("ru-RU", { timeZone: S.tz, hour: "2-digit", minute: "2-digit" }).format(new Date(ts * 1000));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const when = (ts) => (ts >= S.tomorrow ? "завтра " : "") + clock(ts);

function minutesLeft(ts) { return Math.max(0, Math.ceil((ts - now()) / 60)); }
function left(ts) {
  const m = minutesLeft(ts);
  if (!m) return "вот-вот закончит";
  return m < 60 ? `осталось ~${m} мин` : `осталось ~${Math.floor(m / 60)} ч ${String(m % 60).padStart(2, "0")} мин`;
}
function leftShort(ts) {
  const m = minutesLeft(ts);
  return m < 60 ? `${m} мин` : `${Math.floor(m / 60)}ч${String(m % 60).padStart(2, "0")}`;
}

function duration(m) {
  if (m < 60) return `${m} мин`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h} ч ${String(rest).padStart(2, "0")} мин` : `${h} ч`;
}

function durationShort(m) {
  if (m < 60) return `${m} мин`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h}ч${rest}` : `${h} ч`;
}

function timeFields(onChange, onEnter, minutes = 0) {
  const hours = el("input", { type: "number", inputmode: "numeric", min: 0, max: Math.floor(S.maxMinutes / 60), step: 1, value: Math.floor(minutes / 60) });
  const mins = el("input", { type: "number", inputmode: "numeric", min: 0, max: 59, step: 1, value: minutes % 60 });
  const total = () => Math.max(0, Math.min(S.maxMinutes, (Number(hours.value) || 0) * 60 + (Number(mins.value) || 0)));
  const set = (v) => {
    hours.value = Math.floor(v / 60);
    mins.value = v % 60;
    onChange();
  };
  for (const field of [hours, mins]) {
    field.addEventListener("input", onChange);
    field.addEventListener("keydown", (e) => { if (e.key === "Enter") onEnter(); });
  }
  const row = el("div", { class: "pair" },
    el("div", {}, el("label", {}, "часы"), hours),
    el("div", {}, el("label", {}, "минуты"), mins));
  return { row, total, set };
}

function btn(text, onclick, kind) {
  return el("button", { class: "btn" + (kind ? " " + kind : ""), onclick }, text);
}

async function api(path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  let res;
  let data = {};
  try {
    res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", "X-Init-Data": initData },
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal,
    });
    try { data = await res.json(); } catch (e) { if (ctrl.signal.aborted) throw e; }
  } catch (e) {
    throw new Error("Нет связи с сервером — проверь интернет и попробуй ещё раз.");
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok || data.error) throw new Error(data.error || "Сервер не отвечает, попробуй ещё раз.");
  return data;
}

function setState(data) {
  S = data;
  skew = S.now - Date.now() / 1000;
  render();
}

async function load() {
  if (loading) return;
  loading = true;
  const first = !S;
  try {
    setState(await api("/api/state"));
    if (first && S.dm !== 1 && S.bot) allowDm(true);
  }
  catch (e) { if (first) failed(S ? `Не получилось показать приложение: ${e.message}` : e.message); }
  finally { loading = false; schedule(); }
}

function failed(text) {
  S = null;
  app.replaceChildren(el("div", { class: "empty" }, el("p", {}, text), btn("Попробовать ещё раз", load, "secondary")));
}

function schedule() {
  clearTimeout(poll);
  if (document.hidden) return;
  const ticking = !!S && S.machines.some((m) => m.status === "run" || m.status === "hold");
  poll = setTimeout(load, ticking ? 15000 : 45000);
}

async function act(body, done) {
  if (busy) return;
  busy = true;
  try {
    setState(await api("/api/action", body));
    closeSheet();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (done) warn(done);
  } catch (e) {
    warn(e.message);
  } finally {
    busy = false;
  }
}

function warn(text) {
  if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
}

function openSheet(title, body) {
  sheet.replaceChildren(
    el("div", { class: "sheet-bg", onclick: closeSheet }),
    el("div", { class: "sheet" },
      el("div", { class: "sheet-head" }, el("h3", {}, title), el("button", { class: "x", onclick: closeSheet }, "Закрыть")),
      body)
  );
  sheet.hidden = false;
}

function closeSheet() {
  sheet.hidden = true;
  sheet.replaceChildren();
}

const LEFTOVER = ["done", "parked", "loaded"];
const ownerOf = (m) => (m.owner.id === 0 ? "хозяин неизвестен" : who(m.owner));

function statusText(m) {
  if (m.status === "broken") return "сломана" + (m.note ? `: ${m.note}` : "");
  const booked = m.booking ? `, бронь на ${when(m.booking.at)}: ${who(m.booking.user)}` : "";
  if (m.status === "run") return `${ownerOf(m)}, ${left(m.ends)}` + (m.next ? `, следующий: ${who(m.next)}` : "") + booked;
  if (m.status === "hold") return `придержана для ${who(m.owner)} до ${clock(m.ends)}` + booked;
  const things = m.owner && m.owner.id !== 0 ? `вещи ${who(m.owner)}` : "чьи-то вещи";
  const after = (m.next ? `, следующий: ${who(m.next)}` : "") + booked;
  if (m.status === "done") return `закончила${m.finished ? " в " + clock(m.finished) : ""}, внутри ${things}` + after;
  if (m.status === "parked") return `занята: лежат переложенные ${things}` + after;
  if (m.status === "loaded") return `занята: внутри ${things}, программа не запущена` + after;
  return "свободна" + booked;
}

function tile(m) {
  const freeSub = m.booking ? `бронь ${clock(m.booking.at)}` : "свободна";
  const subs = { run: m.ends ? leftShort(m.ends) : "", hold: "ждёт", done: "готово", parked: "вещи", loaded: "вещи", broken: "сломана" };
  const sub = subs[m.status] ?? freeSub;
  const mine = m.status !== "broken" && isMine(m);
  return el("button", { class: `tile ${m.status}${m.booking ? " booked" : ""}${mine ? " mine" : ""}`, onclick: () => openMachine(m) },
    el("b", {}, m.n), el("small", {}, sub));
}

function isMine(m) {
  return isMe(m.owner) || isMe(m.next) || isMe(m.reporter) || (m.booking && isMe(m.booking.user));
}

function gridCard() {
  const byKey = new Map(S.machines.map((m) => [m.t + m.n, m]));
  const walls = S.walls.map((wall) => el("div", { class: "wall" }, wall.map((n) => tile(byKey.get(tab + n)))));
  const lines = S.machines
    .filter((m) => m.t === tab && m.status !== "free")
    .map((m) => el("div", { class: "line", onclick: () => openMachine(m) },
      el("span", { class: "dot " + m.status }), `${mname(m)} — ${statusText(m)}`));
  return el("section", { class: "card" },
    walls,
    el("div", { class: "legend hint" },
      el("span", {}, el("i", { class: "dot free" }), "свободна"),
      el("span", {}, el("i", { class: "dot run" }), "работает"),
      el("span", {}, el("i", { class: "dot hold" }), "придержана"),
      el("span", {}, el("i", { class: "dot done" }), "готово, вещи внутри"),
      el("span", {}, el("i", { class: "dot loaded" }), "вещи без программы"),
      el("span", {}, el("i", { class: "dot parked" }), "переложенные вещи"),
      S.machines.some((m) => m.t === tab && m.booking) ? el("span", {}, el("i", { class: "dot booked" }), "бронь") : null,
      S.machines.some((m) => m.t === tab && m.status === "broken") ? el("span", {}, el("i", { class: "dot broken" }), "сломана") : null),
    lines.length ? el("div", { class: "lines" }, lines) : null);
}

function openMachine(m) {
  const mine = isMe(m.owner);
  const marked = isMe(m.reporter);
  const admin = S.me.admin;
  const leftover = LEFTOVER.includes(m.status);
  if (m.status === "broken") {
    openSheet(mname(m), [
      el("p", {}, cap(statusText(m)) + "."),
      el("p", { class: "hint" }, `Админ отметил её неисправной${m.reporter ? ` (${who(m.reporter)})` : ""}. Занять или забронировать её нельзя, пока не починят.`),
      admin ? btn("Починили — снова работает", () => act({ action: "fixed", t: m.t, n: m.n })) : null,
    ]);
    return;
  }
  const body = [el("p", {}, cap(statusText(m)) + (m.status === "run" ? ` (до ${clock(m.ends)})` : "") + ".")];
  if (m.status === "parked") {
    const by = !m.reporter ? "" : marked ? " (переложено тобой)" : ` (кто: ${who(m.reporter)})`;
    body.push(el("p", { class: "hint" }, `Вещи переложены сюда${by}. Таймер не идёт — машина занята, пока вещи не заберут.`));
  }
  else if (m.status === "loaded") {
    const by = !m.reporter ? "" : marked ? " (отметил ты)" : ` (отметил: ${who(m.reporter)})`;
    body.push(el("p", { class: "hint" }, `Внутри лежат вещи, программа не запущена${by}. Таймер не идёт — машина занята, пока вещи не заберут. Отметка снимется сама через ${S.clothesHours} ч.`));
  }
  else if (m.reporter) {
    const by = marked ? "отметил ты" : `отметил: ${who(m.reporter)}`;
    body.push(el("p", { class: "hint" }, m.owner.id ? `Хозяин нашёлся сам (${by}).` : `Чьи вещи — неизвестно (${by}).`));
  }
  if (m.status === "run" && m.planned) {
    body.push(el("p", { class: "hint" }, `Время исправляли по дисплею${m.editor ? `, последний раз — ${isMe(m.editor) ? "ты" : who(m.editor)}` : ""}. Изначально было до ${clock(m.planned)}.`));
  }
  if (m.booking && isMe(m.booking.user)) {
    body.push(el("p", { class: "hint" }, `Это твоя бронь на ${when(m.booking.at)}. В это время машина будет ждать тебя ${S.claim} мин. Если её уже заняли без бота — займи любую свободную.`));
    body.push(btn("Отменить бронь", () => act({ action: "unbook", id: m.booking.id }), "secondary"));
  } else if (m.booking && m.status === "free") {
    body.push(el("p", { class: "hint" }, `Забронирована на ${when(m.booking.at)}. Занять можно, только если программа закончится раньше.`));
  }
  if (m.status === "free" || (["hold", "done", "loaded"].includes(m.status) && (mine || marked))) {
    const pickOwner = m.status === "free" || m.status === "loaded";
    const busy = pickOwner && S.machines.some((x) => !(x.t === m.t && x.n === m.n) && x.status === "run" && isMe(x.owner));
    let owner = !pickOwner ? "me" : m.status === "loaded" && m.owner.id === 0 ? "unknown" : busy ? null : "me";
    const action = m.status === "free" ? "Занять" : "Запустить программу";
    const start = btn(action, () => go());
    const choices = [["me", "Мои вещи"], ["unknown", "Не мои, просто отмечаю"]].map(([v, text]) =>
      [v, el("button", { class: "chip", onclick: () => { owner = v; paint(); } }, text)]);
    const hideName = nameToggle();
    const paint = () => {
      for (const [v, chip] of choices) chip.className = v === owner ? "chip on" : "chip";
      hideName.row.style.display = owner === "me" ? "" : "none";
      start.disabled = !owner;
      start.textContent = !pickOwner ? action : !owner ? "Выбери, чьи вещи" : `${action}: ${owner === "me" ? "мои вещи" : "не мои"}`;
    };
    paint();
    const time = timeFields(() => sync(), () => go());
    const summary = el("p", { class: "total" });
    const sync = () => {
      const t = time.total();
      summary.replaceChildren(t ? `Итого ${duration(t)}, до ${clock(now() + t * 60)}` : "Укажи, сколько осталось по дисплею");
    };
    const go = async () => {
      if (!time.total() || !owner) return;
      if (owner === "me" && !(await applyName(hideName.box))) return;
      act({ action: "take", t: m.t, n: m.n, time: String(time.total()), owner });
    };
    sync();
    if (pickOwner) body.push(
      el("label", {}, "Чьи вещи в машине?"),
      el("div", { class: "chips two" }, choices.map(([, chip]) => chip)),
      busy ? el("p", { class: "hint", style: "margin:0 0 10px" }, "У тебя уже занята другая машина. Это тоже твои вещи или ты отмечаешь чужую стирку?") : null);
    body.push(
      hideName.row,
      el("label", {}, "Сколько осталось по дисплею машины?"),
      el("div", { class: "chips three" }, [30, 45, 60, 90, 120, 150].map((v) =>
        el("button", { class: "chip", onclick: () => time.set(v) }, durationShort(v)))),
      time.row,
      summary,
      start);
    if (m.status === "free") {
      body.push(el("p", { class: "hint", style: "margin:10px 0 0" }, "В машине лежат чьи-то вещи, а программа не запущена? Отметь это — машина будет занята, пока вещи не заберут, а хозяин сможет нажать «Это мои вещи»."));
      body.push(btn("Тут чужие вещи, без программы", () => act({ action: "load", t: m.t, n: m.n }), "secondary"));
    }
  }
  if (m.status !== "free" && m.status !== "hold" && m.owner.id === 0 && !marked) {
    body.push(btn("Это мои вещи", () => act({ action: "claim", t: m.t, n: m.n }), "secondary"));
  }
  if (m.status === "run") body.push(btn("Время на дисплее другое", () => openRetime(m), "secondary"));
  if (m.status === "run" && ((m.reporter ? marked : mine) || admin)) body.push(btn("Освободить", () => act({ action: "free", t: m.t, n: m.n }), "danger"));
  if (leftover && (mine || marked || admin)) body.push(btn("Вещи забраны", () => act({ action: "free", t: m.t, n: m.n })));
  if (leftover && !mine) body.push(btn("Вещи переложены — указать куда", () => openMove(m), "secondary"));
  if (m.status === "hold" && mine) body.push(btn("Отказаться", () => act({ action: "free", t: m.t, n: m.n }), "danger"));
  if (m.status === "hold" && !mine && admin) body.push(btn("Снять придержку", () => act({ action: "free", t: m.t, n: m.n }), "danger"));
  if ((m.status === "run" || leftover) && !mine) {
    if (isMe(m.next)) body.push(btn("Отменить мою бронь", () => act({ action: "unnext", t: m.t, n: m.n }), "secondary"));
    else if (!m.next) {
      body.push(el("p", { class: "hint" }, `Когда машина освободится, она будет ждать тебя ${S.claim} мин.`));
      body.push(btn("Забронировать, когда освободится", () => act({ action: "next", t: m.t, n: m.n })));
    }
  }
  if (admin) body.push(btn("Отметить сломанной", () => openBroken(m), "danger"));
  openSheet(mname(m), body);
}

function openRetime(m) {
  const admin = S.me.admin;
  const starter = m.reporter ? isMe(m.reporter) : isMe(m.owner);
  const unlimited = admin || starter;
  const planned = m.planned || m.ends;
  const lo = admin ? 1 : Math.max(1, Math.ceil((planned - S.timerShift * 60 - now()) / 60));
  const hi = admin ? S.maxMinutes : Math.floor((Math.min(planned + S.timerShift * 60, m.started + S.maxMinutes * 60) - now()) / 60);
  const body = [el("p", {}, `Сейчас до ${clock(m.ends)}, ${left(m.ends)}.`)];
  const stop = !unlimited && m.editedByMe ? "Ты уже исправлял время на этой программе."
    : !unlimited && m.edits >= S.timerEdits ? `Время уже исправили ${S.timerEdits} человека.`
    : hi < lo ? "Время уже нельзя исправить." : null;
  if (stop) {
    body.push(el("p", { class: "hint" }, stop),
      el("p", { class: "hint" }, "Дальше может только тот, кто запустил машину, или админ чата."),
      btn("← Назад", () => openMachine(m), "secondary"));
    openSheet(`${mname(m)}: время`, body);
    return;
  }
  const time = timeFields(() => sync(), () => go(), minutesLeft(m.ends));
  const summary = el("p", { class: "total" });
  const save = btn("Сохранить время", () => go());
  const sync = () => {
    const t = time.total();
    const ok = t >= lo && t <= hi;
    save.disabled = !ok;
    summary.replaceChildren(!t ? "Укажи, сколько осталось по дисплею" : ok ? `До ${clock(now() + t * 60)}` : `Можно от ${duration(lo)} до ${duration(hi)}`);
  };
  const go = () => {
    const t = time.total();
    if (t >= lo && t <= hi) act({ action: "retime", t: m.t, n: m.n, time: String(t) });
  };
  sync();
  const rules = admin
    ? "Ты админ — ограничений нет."
    : `Машина пересчитала время? Исправь его по дисплею — не дальше ${S.timerShift} мин от изначального (до ${clock(planned)}).` +
      (starter ? "" : " Каждый может исправить время на программе один раз.");
  body.push(
    el("label", {}, "Сколько сейчас осталось по дисплею машины?"),
    time.row,
    summary,
    el("p", { class: "hint", style: "margin:0 0 10px" }, `${rules} Все видят, кто исправил время, а хозяин вещей и те, кто ждёт машину, получат уведомление.`),
    save,
    btn("← Назад", () => openMachine(m), "secondary"));
  openSheet(`${mname(m)}: время`, body);
}

function openBroken(m) {
  const note = el("input", { type: "text", maxlength: S.noteLength, placeholder: "Например: не сливает воду", style: "font-size:16px;text-align:left" });
  openSheet(`${mname(m)} сломана`, [
    el("label", {}, "Что с ней (необязательно)"), note,
    el("p", { class: "hint", style: "margin:8px 0 0" }, "Её нельзя будет занять или забронировать. Кто ждал именно её, встанет в начало очереди, брони на неё перейдут на любую свободную машину, а хозяину вещей внутри придёт уведомление."),
    btn("Отметить сломанной", () => act({ action: "broken", t: m.t, n: m.n, note: note.value }), "danger"),
    btn("← Назад", () => openMachine(m), "secondary"),
  ]);
}

function openMove(m) {
  const body = [
    el("p", {}, `Куда переложены вещи${m.owner.id ? " (" + who(m.owner) + ")" : ""} из ${S.types[m.t].gen} ${m.n}?`),
    btn(S.ironing, () => act({ action: "move", ft: m.t, fn: m.n, to: "board" }), "secondary"),
  ];
  for (const t of Object.keys(S.types)) {
    const free = S.machines.filter((x) => x.t === t && x.status === "free" && !(x.t === m.t && x.n === m.n));
    if (!free.length) continue;
    body.push(el("div", { class: "label" }, S.types[t].title),
      el("div", { class: "chips six" }, free.map((x) =>
        el("button", { class: "chip", onclick: () => act({ action: "move", ft: m.t, fn: m.n, to: "machine", tt: x.t, tn: x.n }) }, x.n))));
  }
  openSheet("Вещи переложены", body);
}

function bookable(t, at) {
  return S.machines.filter((m) =>
    m.t === t &&
    (m.status === "free" || (m.ends <= at && !m.next)) &&
    !S.bookings.some((b) => b.t === t && b.n === m.n && Math.abs(b.at - at) < S.bookingGap * 60));
}

function openSlots(t) {
  const cfg = S.types[t];
  const chips = (list) => el("div", { class: "chips six" }, list.map((ts) => el("button", { class: "chip", onclick: () => openSlotMachines(t, ts) }, clock(ts))));
  const today = S.slots.filter((ts) => ts < S.tomorrow);
  const tomorrow = S.slots.filter((ts) => ts >= S.tomorrow);
  openSheet(`Бронь на ${cfg.acc}`, [
    today.length ? [el("div", { class: "label" }, "Сегодня"), chips(today)] : null,
    tomorrow.length ? [el("div", { class: "label" }, "Завтра"), chips(tomorrow)] : null,
  ]);
}

function openSlotMachines(t, at) {
  const cfg = S.types[t];
  const free = bookable(t, at);
  const day = at >= S.tomorrow ? "завтра " : "";
  const body = [
    el("p", {}, `Какую ${cfg.acc} бронируем на ${day}${clock(at)}? В это время она будет ждать тебя ${S.claim} мин.`),
    el("p", { class: "hint" }, "Бронь видят только те, кто пользуется ботом, — это договорённость, а не гарантия. Если к твоему приходу машину заняли вживую, она занята: займи другую или встань в очередь."),
  ];
  if (!free.length) body.push(el("p", { class: "hint" }, "На это время свободных машин нет — выбери другое время."));
  else {
    body.push(el("div", { class: "chips six" }, free.map((m) => el("button", { class: "chip", onclick: () => act({ action: "book", t, at, n: m.n }) }, m.n))));
    body.push(btn("Любая свободная", () => act({ action: "book", t, at, n: "any" }), "secondary"));
  }
  body.push(btn("← Другое время", () => openSlots(t), "secondary"));
  openSheet(`Бронь на ${clock(at)}`, body);
}

function typeCard() {
  const t = tab;
  const cfg = S.types[t];
  const queue = S.queue[t] || [];
  const pos = queue.findIndex(isMe) + 1;
  const free = S.machines.filter((m) => m.t === t && m.status === "free").length;
  const booking = S.bookings.find((b) => b.t === t && isMe(b.user));
  const parts = [];
  if (pos) parts.push(el("p", {}, `Ты в очереди на ${cfg.acc}: место ${pos}.`), btn("Выйти из очереди", () => act({ action: "unqueue", t }), "secondary"));
  else if (!free || queue.length) parts.push(btn(`Встать в очередь на ${cfg.acc}`, () => act({ action: "queue", t })));
  if (booking) parts.push(el("p", { class: "label" }, `Твоя бронь: ${cfg.acc}${booking.n ? " " + booking.n : ""} в ${when(booking.at)}.`), btn("Отменить бронь", () => act({ action: "unbook", id: booking.id }), "secondary"));
  else parts.push(btn("Забронировать на время", () => openSlots(t), "secondary"));
  if (queue.length) parts.push(el("p", { class: "hint", style: "margin-top:10px" }, "Очередь: " + queue.map(who).join(", ")));
  const books = S.bookings.filter((b) => b.t === t);
  if (books.length) parts.push(el("p", { class: "hint" }, "Брони: " + books.map((b) => `${when(b.at)}${b.n ? " №" + b.n : ""} ${who(b.user)}`).join(", ")));
  parts.push(el("p", { class: "hint", style: "margin:10px 0 0" }, "Нажми на занятую машину, чтобы забронировать её сразу после программы. Бронь и очередь работают только между теми, кто пользуется ботом: машину, которую уже заняли вживую, они не отменяют."));
  return el("section", { class: "card" }, el("h2", {}, "Очередь и бронь"), parts);
}

function mineCard() {
  const mine = S.machines.filter((m) => m.status !== "broken" && isMine(m));
  if (!mine.length) return null;
  const line = (m) => {
    if (isMe(m.next)) return `${mname(m)} — забронирована за тобой после программы`;
    if (m.booking && isMe(m.booking.user) && !isMe(m.owner)) return `${mname(m)} — твоя бронь на ${when(m.booking.at)}`;
    if (isMe(m.reporter)) return `${mname(m)} — отмечена тобой: ${statusText(m)}`;
    return `${mname(m)} — ${statusText(m)}`;
  };
  return el("section", { class: "card" }, el("h2", {}, "Мои машины"),
    mine.map((m) => el("div", { class: "line", onclick: () => openMachine(m) }, el("span", { class: "dot " + m.status }), line(m))));
}

function confirmAct(text, body) {
  if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => { if (ok) act(body); });
  else if (confirm(text)) act(body);
}

function adminCard(kind) {
  if (!S.me.admin) return null;
  const laundry = kind === "laundry";
  return el("section", { class: "card" },
    el("h2", {}, "Для админов"),
    el("p", { class: "hint" }, laundry
      ? "Все машины, кроме сломанных, станут свободными, очередь, брони и записи о переложенных вещах удалятся."
      : "Все текущие и будущие брони игровой будут отменены."),
    btn(laundry ? "Сбросить всё в прачечной" : "Отменить все брони игровой", () => confirmAct(
      laundry ? "Точно сбросить все статусы прачечной?" : "Точно отменить все брони игровой?",
      { action: laundry ? "admin_reset_laundry" : "admin_reset_room" }), "danger"));
}

function nameToggle() {
  const box = el("input", { type: "checkbox" });
  box.checked = !!S.me.hidden;
  return { box, row: el("label", { class: "toggle name-toggle" }, box, el("span", {}, "Не показывать моё имя")) };
}

async function applyName(box) {
  if (box.checked === !!S.me.hidden) return true;
  try {
    await api("/api/action", { action: "privacy", hidden: box.checked });
    S.me.hidden = box.checked;
    return true;
  } catch (e) {
    warn(e.message);
    return false;
  }
}

function guidePrivacy(n, where, demo, dot, example) {
  return guideStep(n, "Не хочешь, чтобы видели твоё имя?",
    `${where} поставь галочку «Не показывать моё имя». Тогда в приложении и в сообщениях бота в чате вместо тебя будет «Аноним». Админы чата имя видят.`,
    [demo, el("div", { class: "toggle", style: "margin-top:8px" }, el("input", { type: "checkbox", checked: "checked", tabindex: "-1" }), el("span", {}, "Не показывать моё имя")),
      el("div", { class: "line", style: "margin-top:8px" }, el("span", { class: "dot " + dot }), example)]);
}

function problemCard() {
  if (!S.problems) return null;
  return el("section", { class: "card" },
    el("h2", {}, "Что-то не так?"),
    el("p", { class: "hint" }, "Приложение или бот работают неправильно, не приходят уведомления или есть идея — расскажи, и я передам администратору бота."),

function openProblem() {
  openSheet("Что случилось?", [
    el("p", { class: "hint" }, "Выбери, к чему это относится."),
    el("div", { class: "kinds" }, S.problems.kinds.map((k) => el("button", { class: "chip", onclick: () => openProblemForm(k) }, k.name))),
  ]);
}

function openProblemForm(kind) {
  const text = el("textarea", { rows: 5, maxlength: S.problems.length, placeholder: kind.hint });
  const send = () => {
    const why = text.value.trim();
    if (!why) { warn("Опиши, что случилось."); return; }
    act({ action: "problem", kind: kind.id, text: why },
      "Спасибо! Передал администратору бота." + (S.dm === 1 ? " Ответ придёт в личку." : " Чтобы получить ответ, разреши боту писать тебе."));
  };
  openSheet(kind.name, [
    el("label", {}, "Опиши, что случилось"),
    text,
    S.dm !== 1 ? el("p", { class: "hint", style: "margin:6px 0 0" }, "Ответ придёт в личку от бота — для этого разреши ему писать тебе.") : null,
    btn("Отправить", send),
    btn("← Другая категория", openProblem, "secondary"),
  ]);
  text.focus();
}

const R = () => S.room;
const step = () => R().step * 60;
const dayByKey = (k) => R().days.find((d) => d.key === k);
const roomOn = (d) => R().bookings.filter((b) => b.starts < d.end && b.ends > d.start);
const roomNow = () => R().bookings.find((b) => b.starts <= now() && b.ends > now());
const dayClock = (d, ts) => (ts >= d.end ? "24:00" : clock(ts));
const dayTitle = (d) => cap(new Intl.DateTimeFormat("ru-RU", { timeZone: S.tz, weekday: "long", day: "numeric", month: "long" }).format(new Date((d.start + 3600) * 1000)));
const monthTitle = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  return cap(new Intl.DateTimeFormat("ru-RU", { timeZone: "UTC", month: "long", year: "numeric" }).format(new Date(Date.UTC(y, m - 1, 1)))).replace(/\s*г\.$/, "");
};
const roomWho = (b) => `${who(b.user)}${b.reason ? " — " + b.reason : ""}`;
const roomDayOf = (ts) => R().days.find((d) => ts < d.end);
const roomFull = (b) => b.capacity !== null && b.going.length >= b.capacity;
const roomGoing = (b) => {
  const names = b.going.map(who).join(", ");
  if (b.capacity === null) return `${b.going.length ? `Идут: ${names}` : "Пока никто не записался"} · без ограничения по числу людей`;
  return `Идут ${b.going.length} из ${b.capacity}${names ? `: ${names}` : ""}${roomFull(b) ? " · мест нет" : ""}`;
};

function roomActs(b) {
  const acts = [];
  if (b.public && !b.mine && b.ends > now()) {
    acts.push(b.joined
      ? el("button", { class: "btn small secondary", onclick: () => act({ action: "room_leave", id: b.id }) }, "Не приду")
      : roomFull(b)
        ? el("button", { class: "btn small", disabled: "disabled" }, "Мест нет")
        : el("button", { class: "btn small", onclick: () => act({ action: "room_join", id: b.id }) }, "Я приду"));
  }
  if (!b.public && !b.mine && b.ends > now()) {
    acts.push(b.joined
      ? el("button", { class: "btn small secondary", onclick: () => act({ action: "room_leave", id: b.id }) }, "Не приду")
      : b.requested === "pending"
        ? el("button", { class: "btn small secondary", onclick: () => act({ action: "room_unask", id: b.id }) }, "Отозвать заявку")
        : b.requested === "declined"
          ? el("button", { class: "btn small", disabled: "disabled" }, "Отказано")
          : el("button", { class: "btn small", onclick: () => openRoomAsk(b) }, "Попроситься"));
  }
  if (b.mine && b.ends > now()) acts.push(el("button", { class: "btn small secondary", onclick: () => openRoomBook(roomDayOf(b.starts), b) }, "Изменить"));
  if (b.mine || S.me.admin) acts.push(el("button", { class: "btn small secondary", onclick: () => act({ action: "room_cancel", id: b.id }) }, "Отменить"));
  return acts.length ? el("div", { class: "acts" }, acts) : null;
}

function roomGuests(b) {
  if (b.public) return [el("div", { class: "hint" }, roomGoing(b))];
  const lines = [];
  if (b.joined) lines.push("Организатор принял твою заявку — ты в списке.");
  else if (b.requested === "pending") lines.push("Заявка отправлена — ждём ответа организатора.");
  else if (b.requested === "declined") lines.push("Организатор отказал в заявке.");
  if (b.going.length) lines.push(`Гости: ${b.going.map(who).join(", ")}`);
  if (b.requests.length) lines.push(`Ждут ответа: ${b.requests.length} — заявки вверху.`);
  return lines.map((t) => el("div", { class: "hint" }, t));
}

function openRoomAsk(b) {
  const note = el("input", { type: "text", maxlength: R().reasonLength, placeholder: "Например: можно мы вдвоём поиграем?", style: "font-size:16px;text-align:left" });
  openSheet("Попроситься в бронь", [
    el("p", {}, el("b", {}, `${dayTitle(roomDayOf(b.starts))}, ${clock(b.starts)}–${clock(b.ends)}`), el("br"), roomWho(b)),
    el("p", { class: "hint" }, "Это закрытая бронь — прийти можно, только если организатор согласится. Бот отправит ему заявку, а он примет её или откажет."),
    el("label", {}, "Сообщение организатору (необязательно)"),
    note,
    el("p", { class: "hint", style: "margin:6px 0 0" },
      "Организатор увидит твоё имя, даже если оно скрыто. " +
      (S.dm === 1 ? "Ответ придёт тебе в личку и будет виден здесь." : "Ответ будет виден здесь, а в личку придёт, если разрешишь боту писать тебе.")),
    btn("Отправить заявку", () => act({ action: "room_ask", id: b.id, note: note.value }, "Заявка отправлена — ждём ответа организатора.")),
    btn("Отмена", closeSheet, "secondary"),
  ]);
}

    el("p", { class: "hint", style: "margin:0 0 4px" }, "Это твои закрытые брони — гость придёт, только если ты согласишься. Ответ придёт ему в личку."),
    list.map((b) => b.requests.map((r) => el("div", { class: "item" },
      el("div", { class: "row" },
        el("div", {},
          el("div", {}, el("b", {}, who(r))),
          el("div", { class: "hint" }, `${dayTitle(roomDayOf(b.starts))}, ${clock(b.starts)}–${clock(b.ends)}${b.reason ? " — " + b.reason : ""}`),
          r.note ? el("div", {}, `«${r.note}»`) : null),
        el("div", { class: "acts" },
          el("button", { class: "btn small", onclick: () => act({ action: "room_answer", id: b.id, user: r.id, accept: true }) }, "Принять"),
          el("button", { class: "btn small secondary", onclick: () => act({ action: "room_answer", id: b.id, user: r.id, accept: false }) }, "Отказать")))))));
}

function roomBadge(b) {
  return b.public ? el("span", { class: "badge open" }, "открытое") : el("span", { class: "badge closed" }, "закрытое");
}

function roomStatusCard() {
  const cur = roomNow();
  const next = R().bookings.find((b) => b.starts > now());
  const text = cur
    ? cur.public
      ? `Сейчас идёт открытое событие до ${when(cur.ends)}: ${roomWho(cur)}. Можно присоединиться!`
      : `Сейчас занята до ${when(cur.ends)}: ${roomWho(cur)}.`
    : `Сейчас свободна.${next ? ` Следующая бронь — ${dayTitle(roomDayOf(next.starts))}, ${clock(next.starts)}.` : ""}`;
  return el("section", { class: "card" }, el("p", { style: "margin:0" }, el("span", { class: "dot " + (cur ? (cur.public ? "free" : "busy") : "free"), style: "display:inline-block;margin-right:8px" }), text));
}

function eventsCard() {
  const list = R().bookings.filter((b) => b.public && b.ends > now()).slice(0, 10);
  if (!list.length) return null;
  return el("section", { class: "card" },
    el("h2", {}, "Открытые события"),
    el("p", { class: "hint", style: "margin:0 0 4px" }, "На них может прийти любой — отметься, чтобы организатор знал, сколько вас."),
    list.map((b) => el("div", { class: "item" },
      el("div", { class: "row" },
        el("div", {},
          el("div", {}, el("b", {}, `${dayTitle(roomDayOf(b.starts))}, ${clock(b.starts)}–${clock(b.ends)}`), b.starts <= now() ? " · сейчас" : ""),
          el("div", { class: "hint" }, roomWho(b)),
          el("div", { class: "hint" }, roomGoing(b))),
        roomActs(b)))));
}

function calendarCard() {
  const months = [...new Set(R().days.map((d) => d.key.slice(0, 7)))];
  if (!months.includes(roomMonth)) roomMonth = months[0];
  const [y, m] = roomMonth.split("-").map(Number);
  const offset = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
  const total = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(el("span", {}));
  for (let dd = 1; dd <= total; dd++) {
    const k = `${roomMonth}-${String(dd).padStart(2, "0")}`;
    const d = dayByKey(k);
    const cls = ["day", d ? "" : "out", k === roomDay ? "sel" : "", d && d === R().days[0] ? "today" : "", d && roomOn(d).length ? "has" : "", d && roomOn(d).some((b) => b.public) ? "open" : ""].filter(Boolean).join(" ");
    cells.push(el("button", { class: cls, disabled: d ? null : "disabled", onclick: () => { roomDay = k; render(); } }, dd));
  }
  const at = months.indexOf(roomMonth);
  return el("section", { class: "card" },
    el("div", { class: "row", style: "margin-bottom:8px" },
      el("button", { class: "x", disabled: at > 0 ? null : "disabled", onclick: () => { roomMonth = months[at - 1]; render(); } }, "‹"),
      el("h2", { style: "margin:0" }, monthTitle(roomMonth)),
      el("button", { class: "x", disabled: at < months.length - 1 ? null : "disabled", onclick: () => { roomMonth = months[at + 1]; render(); } }, "›")),
    el("div", { class: "cal" }, ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map((w) => el("span", { class: "wd" }, w)), cells),
    el("div", { class: "legend hint" }, el("span", {}, el("i", { class: "dot hold" }), "есть брони"), el("span", {}, el("i", { class: "dot free" }), "открытое событие")));
}

function freeRanges(d) {
  const from = Math.max(d.start, Math.floor(now() / step()) * step());
  const out = [];
  let cursor = from;
  for (const b of roomOn(d)) {
    if (b.starts > cursor) out.push([cursor, Math.min(b.starts, d.end)]);
    cursor = Math.max(cursor, b.ends);
  }
  if (cursor < d.end) out.push([cursor, d.end]);
  return out.filter(([a, b]) => b > a);
}

function dayCard() {
  const d = dayByKey(roomDay) || R().days[0];
  roomDay = d.key;
  const list = roomOn(d);
  const free = freeRanges(d);
  return el("section", { class: "card" },
    el("h2", {}, dayTitle(d)),
    list.length
      ? list.map((b) => el("div", { class: "item" },
          el("div", { class: "row" },
            el("div", {},
              el("div", {}, el("b", {}, `${dayClock(d, Math.max(b.starts, d.start))}–${dayClock(d, Math.min(b.ends, d.end))}`), b.starts <= now() && b.ends > now() ? " · сейчас" : "", roomBadge(b)),
              el("div", { class: "hint" }, roomWho(b)),
              roomGuests(b)),
            roomActs(b))))
      : el("p", { class: "hint" }, "Броней нет."),
    el("p", { class: "hint", style: "margin:10px 0 0" }, free.length ? "Свободно: " + free.map(([a, b]) => `${dayClock(d, a)}–${dayClock(d, b)}`).join(", ") : "Свободного времени не осталось."),
    free.length ? btn("Забронировать", () => openRoomBook(d)) : null);
}

function openRoomBook(d, edit = null) {
  const s = step();
  const others = R().bookings.filter((b) => !edit || b.id !== edit.id);
  const taken = (ts) => others.some((b) => b.starts <= ts && b.ends > ts);
  const starts = [];
  const first = Math.max(d.start, Math.floor(now() / s) * s);
  if (edit && edit.starts < first) starts.push(edit.starts);
  for (let ts = first; ts < d.end; ts += s) if (!taken(ts)) starts.push(ts);
  const startSel = el("select", {}, starts.map((ts) => el("option", { value: ts }, clock(ts))));
  if (edit) startSel.value = String(edit.starts);
  const endSel = el("select", {});
  const fillEnds = () => {
    const st = Number(startSel.value);
    const limit = Math.min(st + R().maxHours * 3600, ...others.filter((b) => b.starts > st).map((b) => b.starts));
    const opts = [];
    for (let ts = st + s; ts <= limit; ts += s) opts.push(el("option", { value: ts }, ts >= d.end ? `${clock(ts)} (след. день)` : clock(ts)));
    endSel.replaceChildren(...opts);
    if (opts.length > 1) endSel.selectedIndex = Math.min(3, opts.length - 1);
  };
  startSel.addEventListener("change", fillEnds);
  fillEnds();
  if (edit && [...endSel.options].some((o) => o.value === String(edit.ends))) endSel.value = String(edit.ends);
  const reason = el("input", { type: "text", maxlength: R().reasonLength, placeholder: "Например: настолки, день рождения", style: "font-size:16px;text-align:left" });
  if (edit) reason.value = edit.reason;
  const open = el("input", { type: "checkbox" });
  open.checked = !!(edit && edit.public);
  const openHint = el("p", { class: "hint", style: "margin:6px 0 0" });
  const capacity = el("input", { type: "number", inputmode: "numeric", min: 1, max: R().capacityMax, step: 1, placeholder: "Без ограничения", style: "font-size:16px;text-align:left" });
  if (edit && edit.capacity !== null) capacity.value = String(edit.capacity);
  const capacityBox = el("div", {},
    el("label", { style: "margin-top:10px" }, "Сколько людей ждёшь"),
    capacity,
    el("p", { class: "hint", style: "margin:6px 0 0" }, "Например, 10 — тогда записаться смогут первые 10 человек (ты не в счёт). Оставь пустым, если ограничения нет."));
  const showOpen = () => {
    openHint.textContent = open.checked
      ? "Открытое: в чате позовут всех, любой сможет нажать «Я приду», а ты увидишь, кто идёт."
      : "Закрытое: игровая занята за тобой. Другие могут только попроситься к тебе — ты сам решаешь, принять или отказать.";
    capacityBox.style.display = open.checked ? "" : "none";
  };
  open.addEventListener("change", showOpen);
  showOpen();
  const title = edit ? `Изменить бронь: ${dayTitle(d)}` : `${R().name}: ${dayTitle(d)}`;
  const hideName = nameToggle();
  hideName.row.style.marginTop = "14px";
  const form = [
    el("label", {}, "Начало"), startSel,
    el("label", { style: "margin-top:10px" }, "Конец"), endSel,
    el("label", { style: "margin-top:10px" }, "Зачем бронируешь (необязательно)"), reason,
    el("label", { class: "toggle", style: "margin-top:14px" }, open, el("span", { style: "color:var(--text);font-size:15px" }, "Открытое событие — может прийти любой")),
    openHint,
    capacityBox,
    hideName.row,
    btn(edit ? "Сохранить" : "Забронировать", () => confirmRoomBook()),
  ];
  const confirmRoomBook = () => {
    if (!startSel.value || !endSel.value) return;
    const people = open.checked && capacity.value.trim() ? Number(capacity.value) : null;
    if (people !== null && !(Number.isInteger(people) && people >= 1 && people <= R().capacityMax)) {
      warn(`Число людей — от 1 до ${R().capacityMax}, или оставь поле пустым, если ограничения нет.`);
      return;
    }
    const why = reason.value.replace(/\s+/g, " ").trim();
    const line = (k, v) => el("div", { class: "item" }, el("div", { class: "hint" }, k), el("div", {}, el("b", {}, v)));
    openSheet(title, [
      el("p", { style: "margin:0 0 10px" }, "Всё верно?"),
      line("Дата", dayTitle(d)),
      line("Время", `с ${clock(Number(startSel.value))} до ${endSel.selectedOptions[0].textContent}`),
      line("Зачем", why || "не указано"),
      line("Бронь", open.checked ? "открытое событие — может прийти любой" : "закрытая — игровая занята за тобой, другие могут только попроситься"),
      open.checked ? line("Ждёшь людей", people === null ? "без ограничения" : `до ${people}`) : null,
      line("Имя", hideName.box.checked ? "скрыто — другие увидят «Аноним»" : "видно всем"),
      edit && edit.public && !open.checked && edit.going.length
        ? el("p", { class: "hint", style: "margin:10px 0 0" }, `Записавшиеся (${edit.going.length}) будут сняты с события, им придёт сообщение.`)
        : null,
      edit && !edit.public && open.checked && edit.requests.length
        ? el("p", { class: "hint", style: "margin:10px 0 0" }, `Тем, кто просился (${edit.requests.length}), придёт сообщение, что теперь можно просто нажать «Я приду».`)
        : null,
      btn(edit ? "Да, сохранить" : "Да, бронирую", async () => {
        if (!(await applyName(hideName.box))) return;
        act({
          action: edit ? "room_edit" : "room_book", id: edit ? edit.id : undefined,
          starts: Number(startSel.value), ends: Number(endSel.value), reason: why, public: open.checked, capacity: people,
        });
      }),
      btn("Нет, изменить", () => openSheet(title, form), "secondary"),
    ]);
  };
  openSheet(title, form);
}

function laundryView() {
  const counts = Object.entries(S.types).map(([t, cfg]) =>
    `${cfg.many} ${S.machines.filter((m) => m.t === t && m.status === "free").length} из ${S.numbers.length}`);
  return [
    el("header", { class: "head" },
      guideHead("laundry", "Прачечная"),
      el("div", { class: "hint" }, "Свободно: " + counts.join(", "))),
    guideCard("laundry"),
    el("div", { class: "tabs" }, Object.entries(S.types).map(([t, cfg]) =>
      el("button", { class: t === tab ? "tab on" : "tab", onclick: () => { tab = t; render(); } }, cfg.title))),
    gridCard(),
    mineCard(),
    typeCard(),
    movedCard(),
    adminCard("laundry"),
  ];
}

function roomView() {
  return [
    el("header", { class: "head" }, guideHead("playroom", R().name)),
    guideCard("playroom"),
    roomStatusCard(),
    requestsCard(),
    eventsCard(),
    calendarCard(),
    dayCard(),
    adminCard("room"),
  ];
}

function canAskDm() {
  return !!(tg && tg.requestWriteAccess && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
}

function openBot() {
  const link = `https://t.me/${S.bot}?start=app`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link);
}

function allowDm(auto) {
  if (!canAskDm()) { if (!auto) openBot(); return; }
  tg.requestWriteAccess((ok) => { if (ok) act({ action: "dm" }); });
}

function dmCard() {
  if (S.dm === 1 || !S.bot) return null;
  const ask = canAskDm();
  return el("section", { class: "card" },
    el("b", {}, "Включи личные уведомления"),
    el("p", { class: "hint", style: "margin:6px 0 0" },
      (ask ? "Разреши боту писать тебе" : "Нажми «Старт» в чате с ботом") + (!S.laundry
        ? " — тогда он сможет писать тебе лично: когда скоро начнётся твоя бронь игровой или событие, на которое ты идёшь, нужно подтвердить бронь, кто-то просится к тебе или ответили на твою заявку. Без этого напоминания придут в общий чат."
        : S.room
        ? " — тогда он сможет писать тебе лично: когда стирка заканчивается, подошла твоя очередь или бронь, твои вещи переложили, нужно подтвердить бронь игровой, кто-то просится к тебе или ответили на твою заявку. Без этого напоминания придут в общий чат."
        : " — тогда он сможет писать тебе лично: когда стирка заканчивается, подошла твоя очередь или бронь, или твои вещи переложили. Без этого напоминания придут в общий чат.")),
    btn(ask ? "Разрешить" : "Открыть бота", () => allowDm(false), "secondary"));
}

function render() {
  const views = [S.laundry && ["laundry", "Прачечная"], S.room && ["playroom", R().name]].filter(Boolean);
  if (!views.some(([k]) => k === section)) section = views.some(([k]) => k === S.section) ? S.section : views[0][0];
  const switcher = views.length > 1 && el("div", { class: "tabs" },
    views.map(([k, label]) =>
      el("button", { class: k === section ? "tab on" : "tab", onclick: () => { section = k; render(); } }, label)));
  app.replaceChildren(...[
    switcher,
    dmCard(),
    ...(section === "playroom" ? roomView() : laundryView()),
    privacyCard(),
    problemCard(),
  ].filter(Boolean));
}

if (tg) {
  tg.ready();
  tg.expand();
}
if (!initData) {
  const why = tg ? `Telegram ${tg.platform} ${tg.version} не передал данные входа` : "Скрипт Telegram не загрузился, данных входа в адресе нет";
  app.replaceChildren(el("div", { class: "empty" },
    el("p", {}, "Открой приложение кнопкой из закреплённого сообщения в чате Telegram."),
    el("p", { style: "font-size:12px;word-break:break-word" }, `${why}. ${navigator.userAgent}`)));
} else {
  load();
  setInterval(() => { if (S && !document.hidden) render(); }, 30000);
  document.addEventListener("visibilitychange", () => (document.hidden ? clearTimeout(poll) : load()));
}
</script>
</body>
</html>
